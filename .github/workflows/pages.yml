name: 部署观察池到 GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'mx_stocks_screener/观察池_累计.html'
  # 定时兜底部署：GitHub 防递归设计下，云端 workflow 用 GITHUB_TOKEN 的 push
  # 不会触发本 workflow（本地用户凭据 push 才会），导致网站停在最后一次
  # 本地 push。加 schedule 后无论数据由谁推送，网站每 5 分钟自动拉最新 HTML 重新部署。
  schedule:
    - cron: '*/5 1-3,5-7 * * 1-5'   # 北京交易时段每 5 分钟（与 monitor 同步节奏）
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 准备站点文件（html 作为首页）
        run: |
          mkdir -p _site
          cp "mx_stocks_screener/观察池_累计.html" "_site/index.html"
          cp "mx_stocks_screener/观察池_累计.csv" "_site/观察池_累计.csv"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
