name: 妙想选股观察池监控（云端）

concurrency:
  group: monitor
  cancel-in-progress: false

on:
  schedule:
    # 北京时间上午交易时段：UTC 1:00-3:59 = CST 9:00-11:59（9:30开盘，11:30上午收盘）
    # 注：GitHub Actions cron 不支持「*/5 1-3」这种步长+范围的组合写法，
    #     若合并写会静默丢弃整个触发规则（workflow 状态仍是 active，但永远不会跑）。
    #     必须拆成单小时独立条目（每条内的 */5 是合法的：在单小时内每5分钟触发）。
    - cron: '*/5 1 * * 1-5'     # UTC 1:00-1:59 每5分钟 → CST 9:00-9:59
    - cron: '*/5 2 * * 1-5'     # UTC 2:00-2:59 每5分钟 → CST 10:00-10:59
    - cron: '*/5 3 * * 1-5'     # UTC 3:00-3:59 每5分钟 → CST 11:00-11:59
    # 北京时间下午交易时段：UTC 5:00-7:59 = CST 13:00-15:59（13:00开盘，15:00收盘）
    - cron: '*/5 5 * * 1-5'     # UTC 5:00-5:59 每5分钟 → CST 13:00-13:59
    - cron: '*/5 6 * * 1-5'     # UTC 6:00-6:59 每5分钟 → CST 14:00-14:59
    - cron: '*/5 7 * * 1-5'     # UTC 7:00-7:59 每5分钟 → CST 15:00-15:59（15:00收盘，尾巴留缓冲）
    # 独立收盘后 cron：专门兜底 T+1 跟踪抓取（不依赖下午 cron 的尾巴时段）
    - cron: '5,20 7 * * 1-5'    # 北京 15:05 / 15:20（UTC 7:05/7:20）
  workflow_dispatch:
    inputs:
      force:
        description: '忽略交易时段守卫（测试用）'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run monitor (loop, ~2min density)
        env:
          EM_API_KEY: ${{ secrets.EM_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python screener_monitor.py --loop ${{ github.event.inputs.force == 'true' && '--force' || '' }}
