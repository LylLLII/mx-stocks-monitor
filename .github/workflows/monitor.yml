name: 妙想选股观察池监控（云端）

concurrency:
  group: monitor
  cancel-in-progress: false

on:
  # 2026-08-07 起：本地 Windows 计划任务改为每 3 分钟抓取+推送（本地为主），
  # 云端定时调度停用，避免双写冲突（今天多次 push 被拒/rebase 冲突的根源）。
  # 需要云端跑时：Actions 页面手动 Run workflow（保留 workflow_dispatch 触发）。
  schedule: []
  workflow_dispatch:
    inputs:
      force:
        description: '忽略交易时段守卫（测试用）'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: true
          # 注意：不要加 fetch-depth: 1！脚本冲突处理依赖 git pull --rebase，
          # 浅克隆没有完整历史会导致 rebase 找不到 merge-base 而失败。

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt -q

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run monitor (loop, ~2min density)
        env:
          EM_API_KEY: ${{ secrets.EM_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python screener_monitor.py --loop ${{ github.event.inputs.force == 'true' && '--force' || '' }}
